<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>DsChat</title>
    <link href="/favicon.ico" rel="icon" type="image/x-icon">
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('dschat_theme');
                var theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link href="/web/css/style.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <aside id="sidebar">
        <div id="sidebar-brand">
            <div id="brand-mark">D</div>
            <div>
                <div id="brand-name">DsChat</div>
                <div id="brand-subtitle">AI workspace</div>
            </div>
        </div>
        <div id="sidebar-header">
            <button id="btn-new-chat" type="button">+ New</button>
            <button id="btn-tools" type="button">Tools</button>
            <button id="btn-export" type="button">Export</button>
        </div>
        <ul id="chat-list"></ul>
    </aside>
    <main id="main">
        <div id="main-header">
            <div id="header-left">
                <div id="mode-controls" aria-label="Mode controls">
                    <button class="mode-btn active" data-mode="readonly" type="button">Read</button>
                    <button class="mode-btn" data-mode="writable" type="button">Write</button>
                    <button class="mode-btn" data-mode="sudo" type="button">Sudo</button>
                </div>
            </div>
            <div id="header-actions">
                <button id="btn-validate" type="button">Validate</button>
                <label id="auto-continue-label">
                    <input checked id="auto-continue" type="checkbox"> Auto
                </label>
                <label id="noob-mode-label" style="display:none">
                    <input id="noob-mode" type="checkbox"> Noob Mode
                </label>
                <label id="skip-confirm-label">
                    <input id="skip-confirm" type="checkbox"> Skip Confirm
                </label>
                <button aria-label="Toggle theme" aria-pressed="false" id="theme-toggle" type="button">Dark</button>
                <button id="btn-version" title="Version Info" type="button">v</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <div id="input-shell">
                <textarea id="user-input" placeholder="Message DsChat..." rows="1"></textarea>
                <button id="btn-continue" type="button">Send</button>
            </div>
        </div>
    </main>
</div>

<div class="hidden" id="modal-overlay">
    <div id="modal-content">
        <div id="modal-header">
            <h3 id="modal-title">Tool Management</h3>
            <button id="modal-close">&times;</button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<div class="hidden" id="editor-overlay">
    <div class="editor-card">
        <div class="editor-header">
            <h3 id="editor-title">Edit Message</h3>
            <button id="editor-close">&times;</button>
        </div>
        <div class="editor-body" id="editor-body"></div>
        <div class="editor-footer">
            <button id="editor-cancel">Cancel</button>
            <button id="editor-save">Save</button>
        </div>
    </div>
</div>

<div class="hidden" id="version-overlay">
    <div id="version-content">
        <div id="version-header">
            <h3>Version Info</h3>
            <button id="version-close">&times;</button>
        </div>
        <div id="version-body">
            <table class="version-table">
                <tr>
                    <td class="version-label">App</td>
                    <td>DsChat</td>
                </tr>
                <tr>
                    <td class="version-label">Version</td>
                    <td>1.0.1</td>
                </tr>
                <tr>
                    <td class="version-label">Author</td>
                    <td>huzpsb</td>
                </tr>
                <tr>
                    <td class="version-label">Made With</td>
                    <td>love</td>
                </tr>
            </table>
        </div>
    </div>
</div>

<script src="/assets/marked.min.js"></script>

<script src="/web/js/app.js"></script>
<script src="/web/js/chat.js"></script>
<script src="/web/js/messages.js"></script>
<script src="/web/js/continue.js"></script>
<script src="/web/js/editor.js"></script>
<script src="/web/js/validate.js"></script>
<script src="/web/js/tools.js"></script>
</body>
</html>
